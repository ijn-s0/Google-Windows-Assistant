name: build-and-test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build src/GeminiLauncher.csproj -c Release
      - name: Launch and capture screenshots
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/bin/Release/net48/GeminiLauncher.exe").Path
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          function RunShot($name, $args2) {
            $p = Start-Process $exe -ArgumentList $args2 -PassThru
            Start-Sleep 9
            Shot $name
            if ($p.HasExited) { Write-Host "!! $name : process exited early with $($p.ExitCode)" }
            else { "{0}: WorkingSet={1:N0} KB" -f $name, ($p.WorkingSet64/1KB) | Write-Host }
            Stop-Process $p -Force -ErrorAction SilentlyContinue
            Start-Sleep 1
          }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Force $key | Out-Null
          foreach ($mode in @(0, 1)) {
            Set-ItemProperty $key SystemUsesLightTheme $mode -Type DWord
            Set-ItemProperty $key AppsUseLightTheme $mode -Type DWord
            Set-ItemProperty $key EnableTransparency 1 -Type DWord
            $m = if ($mode -eq 0) { 'dark' } else { 'light' }
            RunShot "home-$m" @('--portable', '--show')
            RunShot "app-$m" @('--portable', '--query', 'notepad')
            RunShot "web-$m" @('--portable', '--query', '"weather vancouver"')
            RunShot "calc-$m" @('--portable', '--query', '"(12+8)*3"')
          }
          RunShot "settings" @('--portable')
          $log = "$env:APPDATA\GeminiLauncher\error.log"
          if (Test-Path $log) { Write-Host "---- error.log ----"; Get-Content $log; Copy-Item $log shots/ }
          Get-ChildItem shots | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.os }}
          path: shots
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-2025'
        with:
          name: GeminiLauncher-exe
          path: src/bin/Release/net48/GeminiLauncher.exe
