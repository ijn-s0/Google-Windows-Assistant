name: abtest
permissions:
  contents: write
on:
  push:
    branches: [arena/912b55e1-gemini-launcher]
  workflow_dispatch:
jobs:
  ab:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build NEW code
        run: dotnet build src/GeminiLauncher.csproj -c Release
      - name: Build OLD code (bec8170 from codeload)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://codeload.github.com/${{ github.repository }}/tar.gz/bec8170" -OutFile old.tar.gz
          tar -xzf old.tar.gz
          $oldSrc = (Get-ChildItem -Directory gemini-launcher-* | Select-Object -First 1).FullName
          echo "OLDSRC=$oldSrc" | Out-File $env:GITHUB_ENV
          dotnet build "$oldSrc\src\GeminiLauncher.csproj" -c Release
      - name: A/B test
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ab | Out-Null
          $out = New-Object System.Collections.Generic.List[string]
          function Log-Line($s) { $s | Write-Host; $script:out.Add($s) }

          $app = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application"
          $rt = (Get-ChildItem $app -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'msedgewebview2.exe') } | Select-Object -First 1).FullName
          Log-Line "RUNTIME FOLDER: $rt"
          Log-Line "--- version folder contents ---"
          Get-ChildItem $rt | ForEach-Object { Log-Line ("  " + $(if ($_.PSIsContainer) { '[D] ' } else { '    ' }) + $_.Name) }
          try {
            $vp = Start-Process (Join-Path $rt 'msedgewebview2.exe') -ArgumentList '--version' -NoNewWindow -PassThru -RedirectStandardOutput ab\wv-ver.txt -RedirectStandardError ab\wv-err.txt
            if (-not $vp.WaitForExit(15000)) { Log-Line "msedgewebview2 --version: TIMEOUT (did not exit in 15s)"; $vp.Kill() }
            else { Log-Line "msedgewebview2 --version (exit $($vp.ExitCode)): $((Get-Content ab\wv-ver.txt -Raw) -replace "`r?`n",' ')" }
            if (Test-Path ab\wv-err.txt) { $e = Get-Content ab\wv-err.txt -Raw; if ($e) { Log-Line "stderr: $e" } }
          } catch { Log-Line "msedgewebview2 --version threw: $_" }

          function Run-One($exe, $tag) {
            if (-not (Test-Path $exe)) { Log-Line "$tag : exe missing ($exe)"; return }
            Remove-Item "$env:APPDATA\GeminiLauncher\error.log" -ErrorAction SilentlyContinue
            $p = Start-Process $exe -ArgumentList @('--portable', '--query', '"weather vancouver"') -PassThru
            $elapsed = 0
            foreach ($wait in 5, 5, 10, 10) {
              Start-Sleep -Seconds $wait
              $elapsed += $wait
              $n = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
              Log-Line "$tag : t=${elapsed}s msedgewebview2=$n exited=$($p.HasExited)"
            }
            $log = "$env:APPDATA\GeminiLauncher\error.log"
            if (Test-Path $log) { Log-Line "--- $tag error.log ---"; Get-Content $log | ForEach-Object { Log-Line $_ } }
            Stop-Process $p -Force -ErrorAction SilentlyContinue
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
          }
          Run-One "src\bin\Release\net48\GeminiLauncher.exe" "NEW"
          if ($env:OLDSRC) { Run-One "$env:OLDSRC\src\bin\Release\net48\GeminiLauncher.exe" "OLD" }
          $out | Set-Content ab\ab-result.txt
      - name: Publish result to a branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -f ab/ab-result.txt
          git commit -m "ab result" | Out-Null
          git push -f origin "HEAD:refs/heads/ci-ab-result"
