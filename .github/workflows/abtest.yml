name: abtest
permissions:
  contents: write
on:
  push:
    branches: [arena/912b55e1-gemini-launcher]
  workflow_dispatch:
jobs:
  ab:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build NEW code
        run: dotnet build src/GeminiLauncher.csproj -c Release
      - name: Build OLD code (bec8170 from codeload)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ab | Out-Null
          try {
            Invoke-WebRequest "https://codeload.github.com/${{ github.repository }}/tar.gz/bec8170" -OutFile old.tar.gz
            tar -xzf old.tar.gz
            $oldSrc = (Get-ChildItem -Directory gemini-launcher-* | Select-Object -First 1).FullName
            "OLDSRC=$oldSrc" | Out-File $env:GITHUB_ENV -Append
            "extracted to $oldSrc" | Set-Content ab\old-build.log
            dotnet build "$oldSrc\src\GeminiLauncher.csproj" -c Release *>> ab\old-build.log
            "build exit=$LASTEXITCODE" | Add-Content ab\old-build.log
          } catch { "EXCEPTION: $_" | Set-Content ab\old-build.log }
      - name: Fallback OLD exe from run artifact
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ab | Out-Null
          gh run download 40301648580 -n GeminiLauncher-exe -D oldexe *> ab\old-download.log
          "exit=$LASTEXITCODE" | Add-Content ab\old-download.log
          Get-ChildItem -Recurse oldexe -ErrorAction SilentlyContinue | ForEach-Object { "artifact: $($_.FullName)" } | Add-Content ab\old-download.log
      - name: Diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ab | Out-Null
          $out = New-Object System.Collections.Generic.List[string]
          function Log-Line($s) { $s | Write-Host; $script:out.Add($s) }
          Log-Line "Windows: $((Get-CimInstance Win32_OperatingSystem).Caption) build $((Get-CimInstance Win32_OperatingSystem).BuildNumber)"
          try { Get-WindowsFeature Server-Media-Foundation,Desktop-Experience | ForEach-Object { Log-Line "feature $($_.Name): $($_.InstallState)" } } catch { Log-Line "feature query n/a" }

          $app = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application"
          $rt = (Get-ChildItem $app -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'msedgewebview2.exe') } | Select-Object -First 1).FullName
          Log-Line "RUNTIME FOLDER: $rt"

          function Run-One($exe, $tag) {
            if (-not (Test-Path $exe)) { Log-Line "$tag : exe missing ($exe)"; return }
            Remove-Item "$env:APPDATA\GeminiLauncher\error.log" -ErrorAction SilentlyContinue
            $p = Start-Process $exe -ArgumentList @('--portable', '--query', '"weather vancouver"') -PassThru
            $seen = 0
            for ($i = 0; $i -lt 24; $i++) {
              Start-Sleep -Milliseconds 500
              if (@(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count -gt 0) { $seen++ }
            }
            $proc = Get-Process GeminiLauncher -ErrorAction SilentlyContinue | Select-Object -First 1
            Log-Line "$tag : wv2-samples=$seen/24 appExited=$($p.HasExited) appPath=$($proc.Path)"
            $loader = "$env:LOCALAPPDATA\GeminiLauncher\WebView2Loader"
            if (Test-Path $loader) { Log-Line "$tag : loader: $((Get-ChildItem $loader -Recurse | ForEach-Object { $_.FullName.Replace($loader,'') }) -join '; ')" }
            $log = "$env:APPDATA\GeminiLauncher\error.log"
            if (Test-Path $log) { Log-Line "--- $tag error.log ---"; Get-Content $log | ForEach-Object { Log-Line $_ } }
            Stop-Process $p -Force -ErrorAction SilentlyContinue
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
          }
          Run-One "src\bin\Release\net48\GeminiLauncher.exe" "NEW"
          if ($env:OLDSRC) { Run-One "$env:OLDSRC\src\bin\Release\net48\GeminiLauncher.exe" "OLD-BUILD" }
          Run-One "oldexe\GeminiLauncher.exe" "OLD-ARTIFACT"

          Log-Line "--- recent Application error events ---"
          try {
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2} -MaxEvents 15 -ErrorAction Stop |
              Where-Object { $_.Message -match 'webview|edge|Gemini' } |
              ForEach-Object { Log-Line ("[" + $_.TimeCreated + "] " + (($_.Message -split "`n" | Select-Object -First 3) -join ' | ')) }
          } catch { Log-Line "event log query failed: $_" }
          $out | Set-Content ab\diag-result.txt
      - name: Publish results to a branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -f ab
          git commit -m "diag result" | Out-Null
          git push -f origin "HEAD:refs/heads/ci-ab-result"
