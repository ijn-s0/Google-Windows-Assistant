name: abtest
permissions:
  contents: write
on:
  push:
    branches: [arena/912b55e1-gemini-launcher]
  workflow_dispatch:
jobs:
  ab:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build NEW code
        run: dotnet build src/GeminiLauncher.csproj -c Release
      - name: Download OLD (bec8170) build artifact
        continue-on-error: true
        shell: pwsh
        run: gh run download 40301648580 -n GeminiLauncher-exe -D oldexe
      - name: A/B test
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ab | Out-Null
          $out = New-Object System.Collections.Generic.List[string]
          function Log-Line($s) { $s | Write-Host; $script:out.Add($s) }

          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys | ForEach-Object { Log-Line "REG $_ pv=$((Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv)" }
          foreach ($base in @("$env:ProgramFiles\Microsoft\EdgeWebView\Application",
                              "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application",
                              "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")) {
            Log-Line "BASE $base exists=$(Test-Path $base)"
            if (Test-Path $base) {
              Get-ChildItem $base -Directory | ForEach-Object {
                $v = $_.FullName
                Log-Line "  $($_.Name): exe=$(Test-Path (Join-Path $v 'msedgewebview2.exe')) chrome.dll=$(Test-Path (Join-Path $v 'chrome.dll')) EBWebView=$(Test-Path (Join-Path $v 'EBWebView'))"
              }
            }
          }

          function Run-One($exe, $tag) {
            if (-not (Test-Path $exe)) { Log-Line "$tag : exe missing ($exe)"; return }
            Remove-Item "$env:APPDATA\GeminiLauncher\error.log" -ErrorAction SilentlyContinue
            $p = Start-Process $exe -ArgumentList @('--portable', '--query', '"weather vancouver"') -PassThru
            $elapsed = 0
            foreach ($wait in 5, 5, 10, 10) {
              Start-Sleep -Seconds $wait
              $elapsed += $wait
              $n = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
              Log-Line "$tag : t=${elapsed}s msedgewebview2=$n exited=$($p.HasExited)"
            }
            $log = "$env:APPDATA\GeminiLauncher\error.log"
            if (Test-Path $log) { Log-Line "--- $tag error.log ---"; Get-Content $log | ForEach-Object { Log-Line $_ } }
            Stop-Process $p -Force -ErrorAction SilentlyContinue
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
          }
          Run-One "src\bin\Release\net48\GeminiLauncher.exe" "NEW"
          Run-One "oldexe\GeminiLauncher.exe" "OLD"
          $out | Set-Content ab\ab-result.txt
      - name: Publish result via Contents API
        if: always()
        shell: pwsh
        run: |
          $repo = '${{ github.repository }}'
          $branch = 'ci-ab-result'
          $mainSha = (gh api repos/$repo/git/ref/heads/main --jq .object.sha)
          gh api repos/$repo/git/refs -f ref=refs/heads/$branch -f sha=$mainSha 2>$null | Out-Null
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes('ab\ab-result.txt'))
          $existing = gh api repos/$repo/contents/ab/ab-result.txt?ref=$branch --jq .sha 2>$null
          if ($existing) {
            gh api repos/$repo/contents/ab/ab-result.txt -X PUT -f message="ab result" -f content=$b64 -f branch=$branch -f sha=$existing | Out-Null
          } else {
            gh api repos/$repo/contents/ab/ab-result.txt -X PUT -f message="ab result" -f content=$b64 -f branch=$branch | Out-Null
          }
          Write-Host "published to $branch"
